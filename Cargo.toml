[workspace]
resolver = "2"
members = [
    "crates/pathless-itm",
    "crates/pathless-rf",
    "crates/pathless-data",
    "crates/pathless-engine",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n9tax/PathLess"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rayon = "1"
png = "0.17"
directories = "6"
tracing = "0.1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
