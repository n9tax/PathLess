[package]
name = "pathless-data"
description = "Automatic terrain (USGS 3DEP) and land-cover (NLCD) acquisition, caching, mosaicking and path profiles for PathLess"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
# GeoTIFF decoding is implemented in-crate (src/geotiff.rs); the `tiff` crate (checked 0.11.3)
# rejects 8-bit palette images such as the NLCD WCS output. Pure Rust, no GDAL.
weezl = "0.1"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
geographiclib-rs = "0.2"

[dev-dependencies]
tokio = { workspace = true }
