name: Release

# Push a tag like v0.1.0 to build the Linux installers and attach them to a
# draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Build on the oldest supported Ubuntu so the .deb/.rpm/AppImage run on
    # as many distributions as possible (glibc is forward-compatible only).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf rpm file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installers
        working-directory: app/src-tauri
        run: cargo tauri build

      - name: Collect artifacts
        run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
             target/release/bundle/appimage/*.AppImage dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: pathless-linux
          path: dist/*

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes --title "PathLess $GITHUB_REF_NAME"
